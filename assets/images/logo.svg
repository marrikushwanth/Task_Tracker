<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" width="200" height="48" fill="none">
    <defs>
        <linearGradient id="tfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#7c3aed" />
        </linearGradient>
        <filter id="tfShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4f46e5" flood-opacity="0.3" />
        </filter>
    </defs>
    <!-- Logo Icon -->
    <rect x="4" y="4" width="40" height="40" rx="10" fill="url(#tfGrad)" filter="url(#tfShadow)" />
    <!-- Checkmark Path -->
    <path d="M16 24.5L22 30.5L32 18.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Flow Accent Dot -->
    <circle cx="34" cy="14" r="2.5" fill="#a5b4fc" />
    
    <!-- Wordmark -->
    <text x="56" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Task<tspan fill="#4f46e5">Flow</tspan></text>
</svg>

